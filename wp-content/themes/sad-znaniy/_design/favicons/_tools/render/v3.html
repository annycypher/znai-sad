<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>В3 — монограмма «СЗ» на зелёной плашке</title>
<link rel="stylesheet" href="render.css">
<script src="font.js"></script>
</head>
<body>
  <!-- Плашка на весь холст (full-bleed) со скруглением 112 px ≈ 22 % — как у иконок
       приложений; в 16 px углы не «съедают» буквы. Плашка — --accent #68B96E,
       буквы — --accent-on #FFFFFF. Кегль 250 px, межбуквенный .02em (крупный кегль
       сам по себе даёт воздух; .1em из вордмарка здесь разваливает пару). -->
  <div class="plate" style="background:#68B96E; border-radius:112px">
    <div class="name" style="color:#FFFFFF; font-size:250px; letter-spacing:.02em">Сз</div>
  </div>
</body>
</html>
