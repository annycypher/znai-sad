<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>В5 — белый символ на зелёной плашке</title>
<link rel="stylesheet" href="render.css">
</head>
<body>
  <!-- Плашка на весь холст, скругление 112 px (≈ 22 %). Фон — акцентный зелёный
       #68B96E, символ — белый #FFFFFF. Габарит символа как в В4 (300 px по высоте,
       258 по ширине), чтобы варианты сравнивались один к одному. Текста нет,
       поэтому шрифт не нужен и мастер остаётся чистым вектором. -->
  <div class="plate" style="background:#68B96E; border-radius:112px">
    <img class="mark" src="../../source/logo-sad-white.svg" alt="" width="258" height="300">
  </div>
</body>
</html>
